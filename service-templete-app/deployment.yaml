apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-templete
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: service-templete
  template:
    metadata:
      labels:
        app: service-templete
    spec:
      # imagePullSecrets:
      #   - name: ghcr-secret
      containers:
        - name: service-templete
          image: ghcr.io/mikejohnpp/service-templete:3286993a8283770d24ddad136828d719035eaae0
          ports:
            - containerPort: 8080
          # resources:
          #   limits:
          #     memory: "256Mi"
          #     cpu: "500m"
          #   requests:
          #     memory: "128Mi"
          #     cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: service-templete
  namespace: default
spec:
  selector:
    app: service-templete
  ports:
    - port: 3001
      targetPort: 8080
  type: ClusterIP
