name: final-graduate-project

x-app-image-tag: &image_tag b3371d2430e4c8b33bee88ee643c00e4e8675b78

services:
  mysql-service:
    image: mysql:8.4.9
    container_name: mysql-service
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: FinalGraduateDB
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./db.sql:/docker-entrypoint-initdb.d/02-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  redis-service:
    image: redis:7-alpine
    container_name: redis-service
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "default"]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=default redis-cli ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  kafka:
    image: apache/kafka:4.2.0
    container_name: kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - app-network

  auth-service:
    image: ghcr.io/mikejohnpp/auth-service:*image_tag
    container_name: auth-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql-service/FinalGraduateDB?zeroDateTimeBehavior=convertToNull
      DB_USERNAME: root
      DB_PASSWORD: ""
    depends_on:
      mysql-service:
        condition: service_healthy
    networks:
      - app-network

  user-service:
    image: ghcr.io/mikejohnpp/user-service:*image_tag
    container_name: user-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql-service/FinalGraduateDB?zeroDateTimeBehavior=convertToNull
      DB_USERNAME: root
      DB_PASSWORD: ""
    depends_on:
      mysql-service:
        condition: service_healthy
    networks:
      - app-network

  chat-service:
    image: ghcr.io/mikejohnpp/chat-service:*image_tag
    container_name: chat-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql-service/FinalGraduateDB?zeroDateTimeBehavior=convertToNull
      DB_USERNAME: root
      DB_PASSWORD: ""
      REDIS_HOST: redis-service
      REDIS_PORT: "6379"
      REDIS_PASSWORD: default
    depends_on:
      mysql-service:
        condition: service_healthy
      redis-service:
        condition: service_healthy
    networks:
      - app-network

  notification-service:
    image: ghcr.io/mikejohnpp/notification-service:*image_tag
    container_name: notification-service
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:mysql://mysql-service/FinalGraduateDB?zeroDateTimeBehavior=convertToNull
      DB_USERNAME: root
      DB_PASSWORD: ""
    depends_on:
      mysql-service:
        condition: service_healthy
    networks:
      - app-network

  api-gateway:
    image: ghcr.io/mikejohnpp/api-gateway:*image_tag
    container_name: api-gateway
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
    depends_on:
      auth-service:
        condition: service_started
      user-service:
        condition: service_started
      chat-service:
        condition: service_started
      notification-service:
        condition: service_started
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      api-gateway:
        condition: service_started
      chat-service:
        condition: service_started
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mysql_data:
  kafka_data: