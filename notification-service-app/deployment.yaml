apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      # imagePullSecrets:
      #   - name: ghcr-secret
      containers:
        - name: notification-service
          image: ghcr.io/mikejohnpp/notification-service:c24c95563c8e6918dc8d52fa52575aa1a846177e
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DB_URL
              value: "jdbc:mysql://mysql-service/FinalGraduateDB?zeroDateTimeBehavior=convertToNull"
            - name: DB_USERNAME
              value: "root"
            - name: DB_PASSWORD
              value: ""
          # resources:
          #   limits:
          #     memory: "256Mi"
          #     cpu: "500m"
          #   requests:
          #     memory: "128Mi"
          #     cpu: "250m"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: default
spec:
  selector:
    app: notification-service
  ports:
    - port: 3000
      targetPort: 8080
  type: ClusterIP
